<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>SeeIt — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app app--no-nav app--full">
    <div class="auth">
      <div class="auth__logo">
        <svg class="logo-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#E85D3A"/>
          <path d="M9 24c4-7 10-10 15-10s11 3 15 10c-4 7-10 10-15 10S13 31 9 24Z" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="24" cy="24" r="4.5" fill="#fff"/>
        </svg>
        <span class="logo-text">See<em>It</em></span>
      </div>

      <h1 class="auth__title">Welcome back</h1>
      <p class="auth__sub">Sign in to save spots and share what you ate.</p>

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="field__input" id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="field__input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div style="text-align:right; margin: -6px 0 16px;"><a href="#" style="font-size:13px; font-weight:600; color: var(--color-text-secondary);">Forgot password?</a></div>

      <a href="home.html" class="btn btn--primary">Sign in</a>

      <div class="auth__divider">or continue with</div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn--social">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A10.99 10.99 0 0 0 12 23Z" fill="#34A853"/>
            <path d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.1V7.06H2.18A10.99 10.99 0 0 0 1 12c0 1.78.43 3.46 1.18 4.94l3.66-2.84Z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
        <button class="btn btn--social">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.36 1.43c0 1.14-.42 2.21-1.26 3.21-.84 1-1.87 1.51-3 1.51-.07-.02-.13-.04-.13-.04 0-1.1.45-2.16 1.26-3.16.41-.5.93-.93 1.55-1.26.62-.34 1.21-.52 1.78-.55.07.16.07.32.07.32V1.43Zm3.83 17.05c-.34.79-.75 1.51-1.21 2.18-.64.91-1.16 1.55-1.55 1.91-.61.59-1.27.89-1.97.91-.5 0-1.11-.14-1.81-.43-.7-.29-1.35-.43-1.94-.43-.62 0-1.28.14-2 .43-.71.29-1.29.44-1.71.45-.68.03-1.34-.28-2-.93-.43-.39-.96-1.05-1.61-1.97-.7-.99-1.27-2.13-1.72-3.43C2.16 16.16 2 14.79 2 13.47c0-1.5.32-2.79.97-3.87a5.71 5.71 0 0 1 2.04-2.06 5.49 5.49 0 0 1 2.76-.78c.53 0 1.22.16 2.08.49.86.32 1.4.49 1.65.49.18 0 .79-.19 1.81-.57 1-.36 1.83-.51 2.51-.46 1.83.15 3.21.87 4.13 2.18-1.64.99-2.45 2.39-2.43 4.18.02 1.4.53 2.55 1.51 3.46.45.43.95.76 1.49.99-.12.34-.24.66-.37.97l.04-.01Z"/>
          </svg>
          Continue with Apple
        </button>
      </div>

      <div class="auth__footer">
        New to SeeIt? <a href="signup.html">Create an account</a>
      </div>
    </div>
  </div>
  <script src="js/nav.js"></script>
</body>
</html>
